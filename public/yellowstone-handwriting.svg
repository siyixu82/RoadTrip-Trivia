<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Handwritten Yellowstone National Park artwork</title>
  <desc id="desc">A warm postcard-style image with hand-written Yellowstone National Park lettering, a geyser doodle, pine trees, mountains, and sunlit yellow accents.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7DA"/>
      <stop offset="0.55" stop-color="#FFE6A3"/>
      <stop offset="1" stop-color="#FFD36D"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 178) rotate(118) scale(306 388)">
      <stop stop-color="#FFF7B0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7B4D19" flood-opacity="0.18"/>
    </filter>
    <pattern id="paperSpeckles" width="96" height="96" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="18" r="1.5" fill="#B5812C" opacity="0.12"/>
